# Reference Sequential Thinking server (arch §6.6). Pinned to an exact release.
#
# Stateless reasoning scaffolding. Touches nothing outside its own process.
id: sequential-thinking
name: Sequential Thinking
description: Structured step-by-step problem decomposition.
namespace: sequential_thinking
homepage: https://github.com/modelcontextprotocol/servers

source:
  type: npm
  package: "@modelcontextprotocol/server-sequential-thinking"
  version: "2026.7.4"
  transport: stdio

trust: local_official

runtime:
  isolation: container
  read_only_root: true
  network: none
  run_as_non_root: true
  cpu_limit: 0.25
  memory_limit_mb: 256
  allowed_env:
    - PATH
    - HOME

capabilities:
  - reasoning

risk_level: READ

update_policy: manual
