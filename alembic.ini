# Alembic configuration (arch §27).
#
# The database URL is deliberately absent: `env.py` reads it from `Settings`,
# so `alembic upgrade head` and the running hub can never disagree about which
# database they mean, and no credential is written into a tracked file.
#
#   make migrate                      # upgrade to head
#   alembic revision --autogenerate -m "add x"
#   alembic downgrade -1

[alembic]
script_location = app/database/migrations
prepend_sys_path = .
path_separator = os

# 0001_initial.py, 0002_add_x.py — ordered and greppable.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
